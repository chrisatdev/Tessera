name: bar-integration

# Runs the Phase-5 status-bar integration suite (tessera-bar-login, task 5.3):
# the headless workspace suite plus the Xvfb-only E2E bar tests (tagged
# `x11::bar-position::*`), which need a real X server and are `#[ignore]`d in
# the plain suite. Xvfb/xdotool are installed explicitly — they are NOT dev
# dependencies of the crate.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bar-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 E2E tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-server-xvfb xdotool make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and workspace target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Headless suite: all lib/bin unit tests plus the DM-session detection
      # test (make install into a temp prefix; no GDM/SDDM required). The bar
      # E2E tests stay ignored here.
      - name: Headless workspace tests
        run: cargo test --workspace

      # The Xvfb-only bar E2E (tag `x11::bar-position::*`): exactly one WM at
      # a time (WM_S0 is an exclusive root selection), so --test-threads=1.
      - name: Xvfb bar-position E2E
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24"
          cargo test --test integration
          -- --ignored bar_position --test-threads=1