[package]
name = "tessera-x11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tessera-core = { path = "../tessera-core" }
# "xtest" is only used by the gated integration test (T21) for the XTEST
# keypress fallback; the library itself never touches the extension.
x11rb = { version = "0.14", features = ["xtest"] }
